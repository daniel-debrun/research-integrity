[project]
name = "research-ledger"
version = "0.1.0"
description = "A hash-chained ledger of sources, checked citations and claims, served over MCP"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.10"
dependencies = ["mcp>=1.10", "pypdf>=4"]

[project.scripts]
research-ledger = "research_ledger.server:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/research_ledger"]
